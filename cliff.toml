# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# pi reads CHANGELOG.md after a package update and matches headings of the
# form "## [1.2.0]" against the package version, so headings drop the "v"
# prefix that the git tags use.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# Keep commits that do not follow Conventional Commits; they go to "Other".
filter_unconventional = false
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs?", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci|chore|style)", group = "<!-- 6 -->Maintenance" },
  { message = ".*", group = "<!-- 7 -->Other" },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

[bump]
# Version to use when there is no release tag yet.
initial_tag = "v0.1.0"
